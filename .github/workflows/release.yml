name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle JS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@lts
          cache: true
          install: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle
        run: bun scripts/build-cli.ts --bundle-only

      - name: Sync plugin version
        run: bun scripts/sync-plugin-version.ts

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: cli-bundle
          path: |
            packages/cli/dist/cli.js
            packages/cli/dist/server.js
            packages/cli/dist/publish-package.json

  compile:
    name: Compile ${{ matrix.only }}
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            only: linux-x64
          - os: ubuntu-24.04-arm
            only: linux-arm64
          - os: windows-latest
            only: win32-x64
          - os: macos-latest
            only: darwin-arm64
          - os: macos-15-intel
            only: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        if: matrix.only != 'darwin-x64'
        uses: pnpm/setup@v2
        with:
          runtime: node@lts
          cache: true
          install: false

      - name: Setup Node.js for Intel macOS
        if: matrix.only == 'darwin-x64'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm for Intel macOS
        if: matrix.only == 'darwin-x64'
        run: npm install --global pnpm@11.21.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile host binary
        run: bun scripts/build-cli.ts --only=${{ matrix.only }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.only }}
          path: packages/cli/dist/platforms/${{ matrix.only }}

  publish:
    name: Publish to npm
    needs: [bundle, compile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1 to perform the OIDC exchange.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: cli-bundle
          path: packages/cli/dist

      - name: Download linux-x64
        uses: actions/download-artifact@v4
        with:
          name: cli-linux-x64
          path: packages/cli/dist/platforms/linux-x64

      - name: Download linux-arm64
        uses: actions/download-artifact@v4
        with:
          name: cli-linux-arm64
          path: packages/cli/dist/platforms/linux-arm64

      - name: Download win32-x64
        uses: actions/download-artifact@v4
        with:
          name: cli-win32-x64
          path: packages/cli/dist/platforms/win32-x64

      - name: Download darwin-arm64
        uses: actions/download-artifact@v4
        with:
          name: cli-darwin-arm64
          path: packages/cli/dist/platforms/darwin-arm64

      - name: Download darwin-x64
        uses: actions/download-artifact@v4
        with:
          name: cli-darwin-x64
          path: packages/cli/dist/platforms/darwin-x64

      # No NODE_AUTH_TOKEN: npm only falls back to OIDC when it finds no token.
      # Access and registry come from each package's publishConfig.
      - name: Publish platform packages
        run: |
          set -euo pipefail
          for dir in packages/cli/dist/platforms/*; do
            npm publish "$dir"
          done

      - name: Publish main package
        run: |
          set -euo pipefail
          stage=packages/cli/dist/stage
          mkdir -p "$stage/dist"
          cp packages/cli/dist/publish-package.json "$stage/package.json"
          cp packages/cli/dist/cli.js packages/cli/dist/server.js "$stage/dist/"
          cp packages/cli/README.md "$stage/"
          npm publish "$stage"

      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/cli/dist/platforms/darwin-arm64/transcripts-mcp
            packages/cli/dist/platforms/darwin-x64/transcripts-mcp
            packages/cli/dist/platforms/linux-arm64/transcripts-mcp
            packages/cli/dist/platforms/linux-x64/transcripts-mcp
            packages/cli/dist/platforms/win32-x64/transcripts-mcp.exe
          generate_release_notes: true
