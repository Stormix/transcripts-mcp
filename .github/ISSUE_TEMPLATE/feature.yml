name: Feature
description: Propose a change. Open this before sending a PR for new work.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        PRs should address an existing issue. If this is new work, start here. See [CONTRIBUTING.md](https://github.com/Stormix/transcripts-mcp/blob/main/CONTRIBUTING.md) and the [AI Policy](https://github.com/Stormix/transcripts-mcp/blob/main/AI_POLICY.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior you would like and how it would help.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - MCP tools
        - Search (grep / FTS / semantic)
        - Adapter / new harness
        - CLI / install
        - Cursor plugin
        - Marketing site
        - Docs
        - Other
    validations:
      required: true
